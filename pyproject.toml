[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-vault"
description = "Persistent knowledge vault for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victor Valenzuela" }]
dynamic = ["version"]
keywords = ["mcp", "knowledge-management", "coding-agents", "claude-code", "opencode"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0"]
embedded = ["onnxruntime", "sqlite-vec", "numpy", "tokenizers"]
# Everything the full pytest suite needs beyond mcp+embedded: hdbscan/rank_bm25/optuna
# back the Inception clustering, LongMemEval BM25, and hyperparameter-sweep benchmark
# tests; pyyaml/numpy/networkx/scipy are the CI-mirrored core test/runtime deps. This
# is the single source of truth for "what a contributor venv needs to run pytest clean" -
# keep WORKFLOW.md and .github/workflows/ci.yml pointed at this extra rather than
# ad-hoc package lists.
test = ["pyyaml", "numpy", "networkx", "scipy", "hdbscan", "rank_bm25", "optuna"]

[project.urls]
Homepage = "https://github.com/sandsower/memento-vault"
Issues = "https://github.com/sandsower/memento-vault/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["memento*"]
exclude = ["tests*", "hooks*", "scripts*", "tools*", "benchmark*", "docs*", "skills*", "agents*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # Many long lines are in LLM prompt strings; enforced by formatter instead

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that require slow or network-dependent external resources",
]
